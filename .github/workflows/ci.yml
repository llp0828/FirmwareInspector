name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FirmwareInspector.slnx

      - name: Build
        run: dotnet build FirmwareInspector.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/FirmwareInspector.Core.Tests/FirmwareInspector.Core.Tests.csproj -c Release --no-build

      - name: Verify formatting
        run: dotnet format FirmwareInspector.slnx --verify-no-changes --no-restore

  publish-preview:
    name: Publish preview artifacts
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish application
        run: dotnet publish src/FirmwareInspector.App/FirmwareInspector.App.csproj -c Release -o artifacts/publish

      - name: Publish CLI
        run: dotnet publish src/FirmwareInspector.Cli/FirmwareInspector.Cli.csproj -c Release -o artifacts/publish

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/FirmwareInspector-win-x64.zip

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: FirmwareInspector-win-x64
          path: artifacts/FirmwareInspector-win-x64.zip
          if-no-files-found: error

