name: Feature request
description: Propose a new parser field, CLI option, export format, or workflow.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or SMBIOS structure is currently difficult?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: specification
    attributes:
      label: Specification reference
      description: Include a DMTF Type/field reference or external specification when decoding data.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: Any example data is synthetic or redacted.
          required: true

